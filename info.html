<!doctype html>
<html lang="en">

<head>
    <title>Homeoutside AR viewer</title>
    <meta charset="utf-8">
    <meta name="description" content="&lt;model-viewer&gt; template">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link type="text/css" href="./styles/index.css" rel="stylesheet" />
</head>

<body>
    <div id="info">
        <div>
            <label>Access Token:</label>
            <p id="accessToken" style="width: 500px;">

            </p>
        </div>
        <br/>
        <br/>
        <div>
            <label>Refresh Token:</label>
            <p id="refreshToken" style="width: 500px;">

            </p>
        </div>
    </div>


    <script>

        const accessToken = localStorage.getItem("arviewer.accessToken");
        const refreshTocken = localStorage.getItem("arviewer.refreshToken");

        document.getElementById("accessToken").innerText = accessToken;
        document.getElementById("refreshToken").innerText = refreshTocken;


    </script>

</body>

</html>
