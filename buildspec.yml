version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo Installing dependencies...
      - npm install
  build:
    commands:
      - echo Building project...
      - npm run $buildCommand
  post_build:
    commands:
      - echo build completed on `date`

artifacts:
  files:
    - '**/*'
cache:
  paths:
    - '/node_modules/'